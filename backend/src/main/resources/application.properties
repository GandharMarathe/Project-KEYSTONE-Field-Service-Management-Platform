spring.application.name=keystone-backend

# HTTP
server.port=${SERVER_PORT:8080}

# PostgreSQL — prefer full DB_URL locally. On Render, leave DB_URL unset and
# provide DB_HOST / DB_PORT / DB_NAME instead (jdbc URL is composed below).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:keystone}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Keystone@2026Strong!}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET:KEYSTONE-development-secret-key-change-this-before-production-123456789}

# Comma-separated browser origins allowed to call the API (no trailing slash).
# Local default is Vite. Production must include the Netlify site URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator health for Render health checks
management.endpoints.web.exposure.include=health,info
