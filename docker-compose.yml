# Optional local “hosted-like” stack: Postgres + API.
# Frontend still runs with: cd frontend && npm run dev
#
#   docker compose up --build
#
# Then open http://localhost:5173 with VITE_API_BASE_URL=http://localhost:8080

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Keystone@2026Strong!
    ports:
      - "5432:5432"
    volumes:
      - keystone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keystone"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/keystone
      DB_USERNAME: postgres
      DB_PASSWORD: Keystone@2026Strong!
      JWT_SECRET: KEYSTONE-development-secret-key-change-this-before-production-123456789
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  keystone_pg:
